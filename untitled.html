<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Moderna hemsidor för lokala småföretagare</title>
    <meta name="description" content="Snabba, säkra och mobilanpassade hemsidor utan WordPress.Vi bygger professionella webbplatser med modern teknik och tar hand om hosting, säkerhet och support – så att du kan fokusera på ditt företag.">
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Manrope&amp;display=swap">
    <link rel="stylesheet" href="assets/css/styles.min.css">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      id="silktide-consent-manager-css"
      href="https://cdn.jsdelivr.net/gh/silktide/consent-manager@v2.0.1/silktide-consent-manager.css"
      integrity="sha384-EdMq+R+YOnsbelo08wPenoTlnxbAyxI11NMIxzugx/qAsbh64KcOkqxYqq6pfvO/"
      crossorigin="anonymous"
    />
    <style id="silktide-consent-manager-overrides">
      #stcm-wrapper {
        --boxShadow: -5px 5px 10px 0px #00000012, 0px 0px 50px 0px #0000001a;
        --fontFamily: Helvetica Neue, Segoe UI, Arial, sans-serif;
        --primaryColor:#06B6D4;
        --backgroundColor: #ffffff;
        --textColor: #4b494b;
        --backdropBackgroundColor: #00000033;
        --backdropBackgroundBlur: 0px;
        --iconColor: #06B6D4;
        --iconBackgroundColor: #ffffff;
      }
    </style>
    <script
      src="https://cdn.jsdelivr.net/gh/silktide/consent-manager@v2.0.1/silktide-consent-manager.js"
      integrity="sha384-5Pt34uiIbCsvfiiZXoLi4HRf/YBXjr9c8e+gYeVo9smUaInNHYVtc8NZ8wUnXJIq"
      crossorigin="anonymous"
    ></script>
    <script>
      window.silktideConsentManager.init({
        backdrop: {
          show: true,
        },
        icon: {
          position: "bottomLeft",
        },
        prompt: {
          position: "bottomRight",
        },
        consentTypes: [
          {
            id: "essential",
            label: "Grundläggande",
            description:
              "<p>Dessa cookies är nödvändiga för att webbplatsen ska fungera korrekt och kan inte stängas av. De hjälper till med saker som att logga in och ställa in dina integritetsinställningar.</p>",
            required: true,
            onAccept: function () {
              console.log(
                "Add logic for the required Essential consent type here",
              );
            },
          },
          {
            id: "analytics",
            label: "Analyser",
            description:
              "<p>Dessa cookies hjälper oss att förbättra webbplatsen genom att spåra vilka sidor som är mest populära och hur besökare navigerar runt på webbplatsen.</p>",
            defaultValue: true,
            gtag: "analytics_storage",
          },
          {
            id: "marketing",
            label: "Marknadsföring",
            description:
              "<p>Dessa cookies används av oss och våra annonspartners för att visa dig relevanta annonser på denna webbplats och på andra ställen, och för att mäta hur dessa kampanjer presterar.</p>",
            gtag: ["ad_storage", "ad_user_data", "ad_personalization"],
          },
        ],
        text: {
          prompt: {
            description:
              "<p>Vi använder cookies på vår webbplats för att förbättra din användarupplevelse, tillhandahålla personligt anpassat innehåll och analysera vår trafik.</p>",
            acceptAllButtonText: "Acceptera alla",
            acceptAllButtonAccessibleLabel: "Acceptera alla cookies",
            rejectNonEssentialButtonText: "Avvisa icke-nödvändiga",
            rejectNonEssentialButtonAccessibleLabel:
              "Avvisa alla icke-nödvändiga cookies",
            preferencesButtonText: "Inställningar",
            preferencesButtonAccessibleLabel: "Växla inställningar",
          },
          preferences: {
            title: "Anpassa dina cookieinställningar",
            description:
              "<p>Vi respekterar din rätt till integritet. Du kan välja att inte tillåta vissa typer av cookies. Dina cookie-inställningar gäller för hela vår webbplats.</p>",
            saveButtonText: "Spara och stäng",
            saveButtonAccessibleLabel: "Spara dina cookie-inställningar",
            creditLinkText: "Få den här bannern gratis",
            creditLinkAccessibleLabel: "Få den här bannern gratis",
          },
        },
      });
    </script>
</head>

<body>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/script.min.js"></script>
</body>

</html>
